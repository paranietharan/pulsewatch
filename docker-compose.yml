services:
  postgres:
    image: postgres:16-alpine
    container_name: pulsewatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulsewatch}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pulsewatch_secret}
      POSTGRES_DB: ${POSTGRES_DB:-pulsewatch}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-pulsewatch} -d $${POSTGRES_DB:-pulsewatch}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - pulsewatch-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pulsewatch-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-pulsewatch}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-pulsewatch_secret}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - pulsewatch-network

volumes:
  postgres_data:
    name: pulsewatch_postgres_data
  rabbitmq_data:
    name: pulsewatch_rabbitmq_data

networks:
  pulsewatch-network:
    name: pulsewatch_network
    driver: bridge
