name: Deploy Service (Manual)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch or Git reference to build and deploy"
        required: true
        default: "main"
      service:
        description: "Microservice to build and deploy"
        required: true
        type: choice
        default: "all"
        options:
          - all
          - pulsewatch-api
          - pulse-watch-web
          - pulsewatch-scheduler
          - pulsewatch-probe-worker
          - pulsewatch-notification-service
          - pulse-watch-db
      environment:
        description: "Target environment"
        required: true
        type: choice
        default: "staging"
        options:
          - staging
          - prod

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ap-south-1
  EKS_CLUSTER_NAME: pulsewatch-eks

jobs:
  resolve:
    name: Resolve Deployment Plan
    runs-on: ubuntu-latest
    outputs:
      environment:  ${{ steps.plan.outputs.environment }}
      deploy_env:   ${{ steps.plan.outputs.deploy_env }}
      namespace:    ${{ steps.plan.outputs.namespace }}
      env_short:    ${{ steps.plan.outputs.env_short }}
      services:     ${{ steps.plan.outputs.services }}
      image_tag:    ${{ steps.plan.outputs.image_tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Build Deployment Plan
        id: plan
        run: |
          RAW_ENV="${{ inputs.environment }}"
          if [ "$RAW_ENV" = "prod" ] || [ "$RAW_ENV" = "production" ]; then
            ENV_SHORT="prod"
            NAMESPACE="production"
            DEPLOY_ENV="production"
          else
            ENV_SHORT="staging"
            NAMESPACE="staging"
            DEPLOY_ENV="staging"
          fi

          if [ "${{ inputs.service }}" = "all" ]; then
            SERVICES='["pulsewatch-api","pulse-watch-web","pulsewatch-scheduler","pulsewatch-probe-worker","pulsewatch-notification-service","pulse-watch-db"]'
          else
            SERVICES='["${{ inputs.service }}"]'
          fi

          # Use Git commit ID directly as the image tag
          IMAGE_TAG=$(git rev-parse --short HEAD 2>/dev/null || echo "${GITHUB_SHA:0:7}")

          echo "environment=$RAW_ENV"   >> "$GITHUB_OUTPUT"
          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "namespace=$NAMESPACE"   >> "$GITHUB_OUTPUT"
          echo "env_short=$ENV_SHORT"   >> "$GITHUB_OUTPUT"
          echo "services=$SERVICES"     >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG"   >> "$GITHUB_OUTPUT"

          echo "### 🔧 Manual Deployment Plan" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |"            >> "$GITHUB_STEP_SUMMARY"
          echo "|-------|-------|"            >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target Environment** | \`$RAW_ENV\` |"   >> "$GITHUB_STEP_SUMMARY"
          echo "| **Namespace**          | \`$NAMESPACE\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| **Target Services**    | \`$SERVICES\` |"  >> "$GITHUB_STEP_SUMMARY"
          echo "| **Image Tag**          | \`$IMAGE_TAG\` |" >> "$GITHUB_STEP_SUMMARY"

  build-push:
    name: Build & Push – ${{ matrix.service }}
    needs: resolve
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.resolve.outputs.services) }}
      fail-fast: false
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Microservice
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ENV_SHORT: ${{ needs.resolve.outputs.env_short }}
          IMAGE_TAG: ${{ needs.resolve.outputs.image_tag }}
          SERVICE: ${{ matrix.service }}
        run: |
          case "$SERVICE" in
            pulsewatch-api)
              CONTEXT="pulsewatch-api"
              DOCKERFILE="pulsewatch-api/Dockerfile"
              ECR_REPO="pulsewatch-api"
              ;;
            pulse-watch-web)
              CONTEXT="pulse-watch-web"
              DOCKERFILE="pulse-watch-web/Dockerfile"
              ECR_REPO="pulsewatch-web"
              ;;
            pulsewatch-scheduler)
              CONTEXT="pulsewatch-scheduler"
              DOCKERFILE="pulsewatch-scheduler/Dockerfile"
              ECR_REPO="pulsewatch-scheduler"
              ;;
            pulsewatch-probe-worker)
              CONTEXT="pulsewatch-probe-worker"
              DOCKERFILE="pulsewatch-probe-worker/Dockerfile"
              ECR_REPO="pulsewatch-probe-worker"
              ;;
            pulsewatch-notification-service)
              CONTEXT="pulsewatch-notification-service"
              DOCKERFILE="pulsewatch-notification-service/Dockerfile"
              ECR_REPO="pulsewatch-notification-service"
              ;;
            pulse-watch-db)
              CONTEXT="pulse-watch-db"
              DOCKERFILE="pulse-watch-db/Dockerfile"
              ECR_REPO="pulsewatch-db-migrator"
              ;;
            *)
              echo "ERROR: Unknown service '$SERVICE'"
              exit 1
              ;;
          esac

          TARGET_REPO="${REGISTRY}/${ECR_REPO}"
          echo "=================================================================="
          echo "Building ${SERVICE} from ${CONTEXT} -> ${TARGET_REPO}:${IMAGE_TAG}"
          echo "=================================================================="

          docker build \
            --platform linux/amd64 \
            -t local-image:latest \
            -f "${DOCKERFILE}" \
            "${CONTEXT}"

          docker tag local-image:latest "${TARGET_REPO}:${IMAGE_TAG}"
          docker tag local-image:latest "${TARGET_REPO}:latest"
          docker tag local-image:latest "${TARGET_REPO}:${ENV_SHORT}"

          echo "Pushing images to AWS ECR..."
          docker push "${TARGET_REPO}:${IMAGE_TAG}"
          docker push "${TARGET_REPO}:latest"
          docker push "${TARGET_REPO}:${ENV_SHORT}"

  deploy:
    name: Deploy → ${{ needs.resolve.outputs.namespace }}
    needs: [resolve, build-push]
    runs-on: ubuntu-latest
    environment: ${{ needs.resolve.outputs.deploy_env }}
    steps:
      - name: Checkout Helm Charts (pulsewatch-infra)
        uses: actions/checkout@v4
        with:
          repository: paranietharan/pulsewatch-infra
          path: pulsewatch-infra
          ref: main
          token: ${{ secrets.INFRA_REPO_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2


      - name: Update Kubeconfig
        run: aws eks update-kubeconfig --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Ensure Namespace Exists
        run: |
          NAMESPACE="${{ needs.resolve.outputs.namespace }}"
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace "$NAMESPACE" environment="$NAMESPACE" --overwrite || true

      - name: Helm Upgrade
        run: |
          ENV_SHORT="${{ needs.resolve.outputs.env_short }}"
          NAMESPACE="${{ needs.resolve.outputs.namespace }}"
          REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_TAG="${{ needs.resolve.outputs.image_tag }}"

          if [ "$ENV_SHORT" = "prod" ]; then
            RELEASE_NAME="pulsewatch-production"
          else
            RELEASE_NAME="pulsewatch-staging"
          fi

          SET_ARGS=()
          for SERVICE in $(echo '${{ needs.resolve.outputs.services }}' | jq -r '.[]'); do
            case "$SERVICE" in
              pulsewatch-api)
                SET_ARGS+=(--set "api.image.repository=${REGISTRY}/pulsewatch-api" --set "api.image.tag=${IMAGE_TAG}")
                ;;
              pulse-watch-web)
                SET_ARGS+=(--set "web.image.repository=${REGISTRY}/pulsewatch-web" --set "web.image.tag=${IMAGE_TAG}")
                ;;
              pulsewatch-scheduler)
                SET_ARGS+=(--set "scheduler.image.repository=${REGISTRY}/pulsewatch-scheduler" --set "scheduler.image.tag=${IMAGE_TAG}")
                ;;
              pulsewatch-probe-worker)
                SET_ARGS+=(--set "probeWorker.image.repository=${REGISTRY}/pulsewatch-probe-worker" --set "probeWorker.image.tag=${IMAGE_TAG}")
                ;;
              pulsewatch-notification-service)
                SET_ARGS+=(--set "notificationService.image.repository=${REGISTRY}/pulsewatch-notification-service" --set "notificationService.image.tag=${IMAGE_TAG}")
                ;;
              pulse-watch-db)
                SET_ARGS+=(--set "migrator.image.repository=${REGISTRY}/pulsewatch-db-migrator" --set "migrator.image.tag=${IMAGE_TAG}")
                ;;
            esac
          done

          # Auto-discover RDS endpoint if provisioned
          RDS_ENDPOINT=$(aws rds describe-db-instances \
            --db-instance-identifier pulsewatch-eks-postgres \
            --region ${{ env.AWS_REGION }} \
            --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")

          if [ -n "$RDS_ENDPOINT" ] && [ "$RDS_ENDPOINT" != "None" ]; then
            if [ "$ENV_SHORT" = "prod" ]; then
              DB_NAME="pulsewatch"
            else
              DB_NAME="pulsewatch_staging"
            fi

            SET_ARGS+=(
              --set "database.host=${RDS_ENDPOINT}"
              --set "database.dbName=${DB_NAME}"
              --set "database.sslmode=require"
            )
            echo "Successfully discovered and injected RDS database endpoint (${RDS_ENDPOINT})"

            # Automatically fetch DB credentials from AWS Secrets Manager
            DB_SECRET_RAW=$(aws secretsmanager get-secret-value \
              --secret-id "pulsewatch-eks-rds-credentials" \
              --region ${{ env.AWS_REGION }} \
              --query "SecretString" --output text 2>/dev/null || echo "")

            if [ -n "$DB_SECRET_RAW" ] && [ "$DB_SECRET_RAW" != "None" ]; then
              RESOLVED_DB_PASS=$(echo "$DB_SECRET_RAW" | jq -r '.password // empty')
              if [ -n "$RESOLVED_DB_PASS" ]; then
                SET_ARGS+=(--set "database.password=${RESOLVED_DB_PASS}")
                echo "Successfully retrieved and injected DB password from AWS Secrets Manager."
              fi
            elif [ -n "${{ secrets.DB_PASSWORD || secrets.RDS_PASSWORD }}" ]; then
              SET_ARGS+=(--set "database.password=${{ secrets.DB_PASSWORD || secrets.RDS_PASSWORD }}")
              echo "Injected DB password from GitHub Secrets fallback."
            fi
          fi

          # Fetch SMTP credentials from AWS Secrets Manager if available
          SMTP_SECRET_RAW=$(aws secretsmanager get-secret-value \
            --secret-id "pulsewatch-${ENV_SHORT}-smtp-credentials" \
            --region ${{ env.AWS_REGION }} \
            --query "SecretString" --output text 2>/dev/null || echo "")

          if [ -n "$SMTP_SECRET_RAW" ] && [ "$SMTP_SECRET_RAW" != "None" ]; then
            RESOLVED_SMTP_USER=$(echo "$SMTP_SECRET_RAW" | jq -r '.user // empty')
            RESOLVED_SMTP_PASS=$(echo "$SMTP_SECRET_RAW" | jq -r '.password // empty')
            RESOLVED_SMTP_HOST=$(echo "$SMTP_SECRET_RAW" | jq -r '.host // empty')
            RESOLVED_SMTP_PORT=$(echo "$SMTP_SECRET_RAW" | jq -r '.port // empty')
            RESOLVED_SMTP_FROM=$(echo "$SMTP_SECRET_RAW" | jq -r '.from // empty')

            [ -n "$RESOLVED_SMTP_USER" ] && SET_ARGS+=(--set "smtp.user=${RESOLVED_SMTP_USER}")
            [ -n "$RESOLVED_SMTP_PASS" ] && SET_ARGS+=(--set "smtp.password=${RESOLVED_SMTP_PASS}")
            [ -n "$RESOLVED_SMTP_HOST" ] && SET_ARGS+=(--set "smtp.host=${RESOLVED_SMTP_HOST}")
            [ -n "$RESOLVED_SMTP_PORT" ] && SET_ARGS+=(--set "smtp.port=${RESOLVED_SMTP_PORT}")
            [ -n "$RESOLVED_SMTP_FROM" ] && SET_ARGS+=(--set "smtp.from=${RESOLVED_SMTP_FROM}")
            echo "Successfully retrieved and injected SMTP credentials from AWS Secrets Manager (pulsewatch-${ENV_SHORT}-smtp-credentials)."
          else
            # Fallback to GitHub Environment / Repository Secrets
            if [ -n "${{ secrets.SMTP_USER }}" ]; then
              SET_ARGS+=(--set "smtp.user=${{ secrets.SMTP_USER }}")
            fi
            if [ -n "${{ secrets.SMTP_PASSWORD }}" ]; then
              SET_ARGS+=(--set "smtp.password=${{ secrets.SMTP_PASSWORD }}")
            fi
            if [ -n "${{ secrets.SMTP_HOST }}" ]; then
              SET_ARGS+=(--set "smtp.host=${{ secrets.SMTP_HOST }}")
            fi
            if [ -n "${{ secrets.SMTP_PORT }}" ]; then
              SET_ARGS+=(--set "smtp.port=${{ secrets.SMTP_PORT }}")
            fi
            if [ -n "${{ secrets.SMTP_FROM }}" ]; then
              SET_ARGS+=(--set "smtp.from=${{ secrets.SMTP_FROM }}")
            fi
          fi

          if [ -n "${{ secrets.JWT_SECRET }}" ]; then
            SET_ARGS+=(--set "api.jwtSecret=${{ secrets.JWT_SECRET }}")
          fi

          helm upgrade --install "$RELEASE_NAME" ./pulsewatch-infra/helm/pulsewatch \
            --namespace "${NAMESPACE}" \
            --create-namespace \
            -f ./pulsewatch-infra/helm/pulsewatch/values.yaml \
            -f ./pulsewatch-infra/helm/pulsewatch/values-${ENV_SHORT}.yaml \
            "${SET_ARGS[@]}" \
            --wait --timeout 10m

      - name: Wait for Rollouts
        run: |
          NAMESPACE="${{ needs.resolve.outputs.namespace }}"
          for SERVICE in $(echo '${{ needs.resolve.outputs.services }}' | jq -r '.[]'); do
            case "$SERVICE" in
              pulsewatch-api) COMPONENT="api" ;;
              pulse-watch-web) COMPONENT="web" ;;
              pulsewatch-scheduler) COMPONENT="scheduler" ;;
              pulsewatch-probe-worker) COMPONENT="probe-worker" ;;
              pulsewatch-notification-service) COMPONENT="notification-service" ;;
              pulse-watch-db)
                echo "DB migrator hook executed via Helm pre-upgrade Job."
                continue
                ;;
            esac

            echo "Awaiting rollout status for component '${COMPONENT}' in namespace '${NAMESPACE}'..."
            kubectl rollout status deployment -l "app.kubernetes.io/component=${COMPONENT}" -n "${NAMESPACE}" --timeout=300s
          done

  notify:
    name: Deployment Report
    needs: [resolve, build-push, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Write Job Summary
        run: |
          BUILD_R="${{ needs.build-push.result }}"
          DEPLOY_R="${{ needs.deploy.result }}"

          icon() { [ "$1" = "success" ] && echo "✅" || echo "❌"; }

          echo "## 🚀 PulseWatch Deployment Summary — ${{ needs.resolve.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Build & Push (ECR)** | $(icon $BUILD_R) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Helm Deploy (EKS)**  | $(icon $DEPLOY_R) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Deployment Metadata" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment**: \`${{ needs.resolve.outputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Kubernetes Namespace**: \`${{ needs.resolve.outputs.namespace }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag**: \`${{ needs.resolve.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Microservice(s)**: \`${{ needs.resolve.outputs.services }}\`" >> $GITHUB_STEP_SUMMARY
