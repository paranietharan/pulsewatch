name: Build and Push Microservices to AWS ECR

on:
  push:
    branches:
      - main
      - develop
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional custom image tag (defaults to commit SHA)"
        required: false
        default: ""

env:
  AWS_REGION: us-east-1

jobs:
  build-and-push:
    name: Build & Push Images to ECR
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout Application Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine Target Image Tag
        id: tags
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          else
            TAG="${{ github.sha }}"
          fi

          if [ "${{ github.ref_name }}" = "main" ]; then
            ENV_TAG="prod-latest"
          else
            ENV_TAG="staging-latest"
          fi

          echo "primary_tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "env_tag=$ENV_TAG" >> "$GITHUB_OUTPUT"
          echo "Built images will be tagged with: $TAG and $ENV_TAG"

      - name: Build and Push 6 Microservices
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          PRIMARY_TAG: ${{ steps.tags.outputs.primary_tag }}
          ENV_TAG: ${{ steps.tags.outputs.env_tag }}
        run: |
          # Service definitions: "ECR_REPO_NAME:BUILD_CONTEXT:DOCKERFILE_PATH"
          SERVICES=(
            "pulsewatch-api:./pulsewatch-api:./pulsewatch-api/Dockerfile"
            "pulsewatch-web:./pulse-watch-web:./pulse-watch-web/Dockerfile"
            "pulsewatch-scheduler:./pulsewatch-scheduler:./pulsewatch-scheduler/Dockerfile"
            "pulsewatch-probe-worker:./pulsewatch-probe-worker:./pulsewatch-probe-worker/Dockerfile"
            "pulsewatch-notification-service:./pulsewatch-notification-service:./pulsewatch-notification-service/Dockerfile"
            "pulsewatch-db-migrator:./pulse-watch-db:./pulse-watch-db/Dockerfile"
          )

          for item in "${SERVICES[@]}"; do
            IFS=":" read -r ECR_REPO CONTEXT DOCKERFILE <<< "$item"
            echo "=================================================================="
            echo "Building $ECR_REPO from $CONTEXT"
            echo "=================================================================="

            docker build \
              --platform linux/amd64 \
              -f "$DOCKERFILE" \
              -t "$ECR_REGISTRY/$ECR_REPO:$PRIMARY_TAG" \
              -t "$ECR_REGISTRY/$ECR_REPO:$ENV_TAG" \
              -t "$ECR_REGISTRY/$ECR_REPO:latest" \
              "$CONTEXT"

            echo "Pushing $ECR_REPO images..."
            docker push "$ECR_REGISTRY/$ECR_REPO:$PRIMARY_TAG"
            docker push "$ECR_REGISTRY/$ECR_REPO:$ENV_TAG"
            docker push "$ECR_REGISTRY/$ECR_REPO:latest"
          done

      - name: Deployment Summary
        run: |
          echo "### Microservice Build & Push Succeeded! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "- **Primary Tag**: \`${{ steps.tags.outputs.primary_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment Tag**: \`${{ steps.tags.outputs.env_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ECR Registry**: \`${{ steps.login-ecr.outputs.registry }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Next step: Run Helm deploy in **pulsewatch-infra** targeting staging or production with tag \`${{ steps.tags.outputs.primary_tag }}\`." >> $GITHUB_STEP_SUMMARY
