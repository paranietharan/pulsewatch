<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">PulseWatch architecture</title>
  <desc id="desc">The dashboard connects to the API and PostgreSQL. The scheduler sends checks through RabbitMQ to the probe worker. Results return through RabbitMQ to the API, which sends notifications through RabbitMQ to the notification service.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#172554}.title{font-size:25px;font-weight:700}.label{font-size:18px;font-weight:700}.small{font-size:14px;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2}.primary{fill:#e0efff;stroke:#93c5fd}.queue{fill:#eef2ff;stroke:#a5b4fc}.line{stroke:#64748b;stroke-width:2;fill:none;marker-end:url(#arrow)}.both{marker-start:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="650" rx="22" fill="#f8fafc"/>
  <text x="40" y="48" class="title">PulseWatch · how a check becomes an alert</text>
  <text x="40" y="75" class="small">Dashboard and infrastructure are separate companion projects</text>
  <rect x="40" y="112" width="190" height="74" rx="12" class="box"/><text x="135" y="142" text-anchor="middle" class="label">Web dashboard</text><text x="135" y="164" text-anchor="middle" class="small">separate repository</text>
  <rect x="325" y="112" width="220" height="74" rx="12" class="box primary"/><text x="435" y="142" text-anchor="middle" class="label">API + result processor</text><text x="435" y="164" text-anchor="middle" class="small">incidents and outbox</text>
  <rect x="660" y="112" width="180" height="74" rx="12" class="box"/><text x="750" y="142" text-anchor="middle" class="label">PostgreSQL</text><text x="750" y="164" text-anchor="middle" class="small">monitors and results</text>
  <rect x="935" y="112" width="220" height="74" rx="12" class="box"/><text x="1045" y="142" text-anchor="middle" class="label">Migration CLI</text><text x="1045" y="164" text-anchor="middle" class="small">database schema</text>
  <path d="M230 149H325" class="line both"/><path d="M545 149H660" class="line both"/><path d="M935 149H840" class="line"/>
  <rect x="40" y="270" width="190" height="78" rx="12" class="box primary"/><text x="135" y="302" text-anchor="middle" class="label">Scheduler</text><text x="135" y="324" text-anchor="middle" class="small">claims due monitors</text>
  <rect x="325" y="270" width="220" height="78" rx="12" class="box queue"/><text x="435" y="302" text-anchor="middle" class="label">RabbitMQ</text><text x="435" y="324" text-anchor="middle" class="small">monitor.checks</text>
  <rect x="660" y="270" width="180" height="78" rx="12" class="box primary"/><text x="750" y="302" text-anchor="middle" class="label">Probe worker</text><text x="750" y="324" text-anchor="middle" class="small">checks endpoints</text>
  <rect x="935" y="270" width="220" height="78" rx="12" class="box"/><text x="1045" y="302" text-anchor="middle" class="label">Monitored endpoints</text><text x="1045" y="324" text-anchor="middle" class="small">HTTP / HTTPS</text>
  <path d="M230 309H325" class="line"/><path d="M545 309H660" class="line"/><path d="M840 309H935" class="line"/>
  <path d="M135 270V224H750V186" class="line"/><text x="135" y="215" class="small">read &amp; claim due monitors</text>
  <path d="M750 348V400H590V205H435V186" class="line"/><rect x="605" y="385" width="184" height="28" rx="6" fill="#f8fafc"/><text x="697" y="404" text-anchor="middle" class="small">RabbitMQ · monitor.results</text>
  <rect x="325" y="480" width="220" height="86" rx="12" class="box queue"/><text x="435" y="511" text-anchor="middle" class="label">RabbitMQ</text><text x="435" y="534" text-anchor="middle" class="small">email / webhook queues</text><text x="435" y="553" text-anchor="middle" class="small">delivery outcomes</text>
  <rect x="660" y="480" width="180" height="86" rx="12" class="box primary"/><text x="750" y="511" text-anchor="middle" class="label">Notification</text><text x="750" y="534" text-anchor="middle" class="label">service</text>
  <rect x="935" y="480" width="220" height="86" rx="12" class="box"/><text x="1045" y="513" text-anchor="middle" class="label">Email &amp; webhooks</text><text x="1045" y="538" text-anchor="middle" class="small">Mailpit for local email</text>
  <path d="M325 150H278V523H325" class="line both"/><text x="52" y="459" class="small">outbox messages &amp; delivery outcomes</text>
  <path d="M545 523H660" class="line both"/><path d="M840 523H935" class="line"/>
  <text x="40" y="620" class="small">Go services · PostgreSQL · RabbitMQ</text>
</svg>
